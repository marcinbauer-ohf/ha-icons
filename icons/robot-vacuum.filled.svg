<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke-linejoin="round" stroke-linecap="round" data-keyline="circle" data-motion="The side brush spins as a full ring of bristles while the robot turns from side to side">
  <mask id="c"><rect width="24" height="24" fill="#fff"/><path d="M7 10H15" fill="none" stroke="#000" stroke-width="2"/><circle cx="11" cy="16" r="2" fill="#000"/></mask>
  <mask id="b"><rect width="24" height="24" fill="#fff"/><circle cx="11" cy="13" r="8" fill="#000"/></mask>
  <g data-anim="sway">
    <g mask="url(#c)">
      <circle cx="11" cy="13" r="9"/>
    </g>
    <g mask="url(#b)">
      <g data-anim="brush">
        <path d="M17 7V3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M17 7L20 4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M17 7H21" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M17 7L20 10" fill="none" stroke="currentColor" stroke-width="2" display="none" data-anim="bristle"/>
        <path d="M17 7V11" fill="none" stroke="currentColor" stroke-width="2" display="none" data-anim="bristle"/>
        <path d="M17 7L14 10" fill="none" stroke="currentColor" stroke-width="2" display="none" data-anim="bristle"/>
        <path d="M17 7H13" fill="none" stroke="currentColor" stroke-width="2" display="none" data-anim="bristle"/>
        <path d="M17 7L14 4" fill="none" stroke="currentColor" stroke-width="2" display="none" data-anim="bristle"/>
      </g>
    </g>
  </g>
</svg>
