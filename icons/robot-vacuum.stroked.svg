        <path d="M17 7L20 10" display="none" data-anim="bristle"/>
        <path d="M17 7V11" display="none" data-anim="bristle"/>
        <path d="M17 7L14 10" display="none" data-anim="bristle"/>
        <path d="M17 7H13" display="none" data-anim="bristle"/>
