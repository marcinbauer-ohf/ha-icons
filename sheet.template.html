<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA icon set preview</title>
<style>
/* Spacing scale: 4 8 12 16 24 32 48. Preview swatches keep fixed colours so icons are judged the same in either app theme. */
:root{
  --bg:#f3f2ee;--panel:#faf9f6;--surface:#fff;--ink:#1a1a18;--muted:#63625d;--line:#e0ded6;
  --accent:#1f5fd6;--accent-soft:#1f5fd618;--danger:#b3261e;--ghost:#d81b8c;
  --sw-light:#fff;--sw-light-ink:#1c1c1c;--sw-dark:#101010;--sw-dark-ink:#ececec;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#131312;--panel:#1a1a18;--surface:#222220;--ink:#eceae4;--muted:#a3a199;--line:#30302c;
  --accent:#86b0ff;--accent-soft:#86b0ff22;--danger:#ff8f85;--ghost:#ff6ec7;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;fill:currentColor}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,dl,dd{margin:0}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:15px;font-weight:650;letter-spacing:-.01em}
.bar .meta{color:var(--muted)}
.bar .grow{flex:1}
.search{width:220px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);caret-color:var(--accent)}
.search::placeholder{color:var(--muted)}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--line)}
.seg button{padding:4px 10px;border-radius:6px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.field{display:flex;align-items:center;gap:8px;color:var(--muted)}

/* workbench */
.work{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.main{overflow:auto;padding:16px 24px 48px}
.filters{display:flex;gap:4px;align-items:center;margin-bottom:16px}
.chip{padding:4px 10px;border-radius:999px;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip b{font-weight:500;opacity:.7;margin-left:4px}
.hint{margin-left:auto;color:var(--muted)}
kbd{font:inherit;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,92px),1fr));gap:4px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 8px;border-radius:10px;
  transition:background .12s}
.cell:hover{background:var(--panel)}
.cell[aria-current=true]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.cell .pair{display:flex;align-items:center;gap:10px}
.cell .old{color:var(--muted);opacity:.75}
.cell .nm{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cell[aria-current=true] .nm{color:var(--ink)}
.cell .flag{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%}
.cell .flag.err{background:var(--danger)}
.cell .flag.pin{left:6px;right:auto;background:var(--accent)}
.empty{padding:48px 0;color:var(--muted);max-width:44ch}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* compare */
.cmp{display:grid;grid-auto-flow:column;grid-template-rows:auto repeat(3,auto) auto;gap:8px 12px;justify-content:start;align-items:center}
.cmp .rowlab{color:var(--muted);padding-right:8px}
.cmp .colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:148px;font-weight:600}
.cmp .colhead button:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.cmp .x{color:var(--muted);border-radius:6px;padding:2px}
.cmp .x:hover{color:var(--ink);background:var(--line)}
.cmp .stage{width:148px;height:148px;border-radius:14px}
.cmp .stage svg{width:96px;height:96px}
.cmp .real{display:flex;gap:4px;width:148px}
.cmp .real .stage{flex:1;width:auto;height:48px;border-radius:10px}
.cmp .real .stage svg{width:24px;height:24px}

/* inspector */
.ins{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:24px 24px 48px}
.ins-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.ins-head h2{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.2;overflow-wrap:anywhere}
.ins-head p{color:var(--muted);margin-top:2px}
.tools{display:flex;gap:4px;flex:none}
.tool{display:grid;place-items:center;height:30px;min-width:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tool:hover{border-color:var(--muted)}
.tool[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tool svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stage{position:relative;display:grid;place-items:center;border-radius:20px;background:var(--sw-light);color:var(--sw-light-ink);
  box-shadow:inset 0 0 0 1px #0000000f}
.stage.dark{background:var(--sw-dark);color:var(--sw-dark-ink);box-shadow:inset 0 0 0 1px #ffffff14}
.stage.big{aspect-ratio:1}
.stage.big>svg{position:absolute;inset:18%;width:64%;height:64%}
.stage .ghost{color:var(--ghost);opacity:.4}
.stage .rules{fill:none;stroke:currentColor;opacity:.16}
.stage .rules .live{stroke:var(--accent);opacity:1;stroke-dasharray:3 3}
.stage .rules *{vector-effect:non-scaling-stroke;stroke-width:1}
.stage-opts{display:flex;align-items:center;gap:12px;margin:12px 0 0;color:var(--muted)}
.stage-opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.stage-opts input{accent-color:var(--accent);margin:0}
.stage-opts .seg{margin-right:auto}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.trio button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 8px 10px;border-radius:14px;color:var(--muted)}
.trio button:hover{background:var(--surface)}
.trio button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.trio .stage{width:100%;aspect-ratio:1.4;border-radius:10px}
.trio .stage svg{width:56px;height:56px}
.trio .none{font-size:11px;opacity:.6}

.ins section{margin-top:32px}
.ins h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.strips{display:grid;gap:8px}
.strip{display:flex;align-items:flex-end;justify-content:space-around;padding:20px 16px 12px;border-radius:14px;
  background:var(--sw-light);color:var(--sw-light-ink);box-shadow:inset 0 0 0 1px #0000000f}
.strip.dark{background:var(--sw-dark);color:var(--sw-dark-ink);box-shadow:inset 0 0 0 1px #ffffff14}
.strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.strip figcaption{opacity:.55}
/* Tile card, modernised: no border, 20px radius, 32px icon in a 40px rounded square, all on the 4px grid
   (Home Assistant default: 1px border, 12px radius, 24px icon in a 36px circle) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tilebg{padding:20px 16px;border-radius:14px;background:#eef0f3;color:#1c1c1c}
.tilebg.dark{background:#0c0c0d;color:#ececec}
.tile{display:flex;align-items:center;gap:12px;padding:8px;border-radius:20px;background:#fff;line-height:1.25;min-width:0}
.dark .tile{background:#1e1f22}
.tile i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#f5a524;background:#f5a52433}
.tile span{min-width:0}
.tile b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;opacity:.65}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 24px}
dt{color:var(--muted)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notes li{padding:8px 12px;border-radius:8px;background:var(--surface);overflow-wrap:anywhere}
.notes li.err{color:var(--danger)}
.ok{color:var(--muted)}

.rel{display:flex;flex-wrap:wrap;gap:6px}
.relchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
button.relchip:hover{border-color:var(--muted)}
.relchip small{color:var(--muted)}
.relchip.missing{border-style:dashed;color:var(--muted)}
.rel+.link{margin-top:12px}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chip.on{background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px}
.doc{max-width:72ch;font-size:14px;line-height:1.55;padding-bottom:48px}
.doc h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-bottom:8px;text-wrap:balance}
.doc h2{font-size:16px;font-weight:650;margin:40px 0 8px}
.doc p{color:var(--muted);margin-bottom:8px}
.doc ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.doc li{display:block;padding:8px 0;border-top:1px solid var(--line)}
.doc code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;padding:1px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.doc .how{float:right;margin-left:16px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.doc .how.lint{border-color:var(--accent);color:var(--accent)}
.doc .how.build{border-color:var(--ink);color:var(--ink)}
@media (max-width:980px){
  body{overflow:auto;display:block}
  .work{display:block}
  .main,.ins{overflow:visible}
  .ins{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">{{defs}}</svg>

<header class="bar">
  <h1>HA icon set</h1>
  <span class="meta" id="meta"></span>
  <span class="grow"></span>
  <input class="search" id="q" type="search" placeholder="Search icons" aria-label="Search icons">
  <div class="seg" data-key="mode" role="group" aria-label="View"><button data-v="browse">Browse</button><button data-v="compare">Compare <span id="pincount"></span></button><button data-v="rules">Rules</button></div>
  <div class="seg" data-key="variant" role="group" aria-label="Variant"><button data-v="filled">Filled</button><button data-v="stroked">Stroked</button></div>
  <div class="seg" data-key="show" role="group" aria-label="Show MDI original"><button data-v="new">New only</button><button data-v="mdi">Next to MDI</button></div>
  <div class="seg" data-key="size" role="group" aria-label="Icon size"><button data-v="20">20</button><button data-v="24">24</button><button data-v="32">32</button><button data-v="48">48</button></div>
  <div class="seg" data-key="theme" role="group" aria-label="App theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
</header>

<div class="work">
  <main class="main" id="main"></main>
  <aside class="ins" id="ins" aria-label="Selected icon"></aside>
</div>

<template id="rules">{{rules}}</template>
<script>
const ICONS = {{data}}, RADIUS = "{{radius}}"
const byName = Object.fromEntries(ICONS.map(i => [i.n, i]))
const S = {sel: ICONS[0].n, mode: 'browse', variant: 'filled', show: 'new', size: '24', theme: 'light',
  filter: 'all', q: '', uses: '', pins: [], stageV: 'filled', stage: 'light', rules: false, ghost: false}
try { Object.assign(S, JSON.parse(localStorage.getItem('ha-icons-sheet') || '{}')) } catch {}
if (!byName[S.sel]) S.sel = ICONS[0].n
S.pins = S.pins.filter(n => byName[n])

const $ = id => document.getElementById(id)
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))
const use = (n, v, px, cls = '') => v === 'mdi' && !byName[n].m ? '' :
  `<svg class="${cls}" width="${px}" height="${px}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${n}-${v}"/></svg>`
const LABEL = {mdi: 'MDI', filled: 'Filled', stroked: 'Stroked'}
const FILTERS = {all: () => true, drawn: i => i.d, derived: i => !i.d, issues: i => i.e}
const visible = () => ICONS.filter(i => FILTERS[S.filter](i) && i.n.includes(S.q.trim().toLowerCase()) &&
  (!S.uses || i.u.some(u => u[0] === S.uses)))
const usedIn = n => ICONS.filter(i => i.u.some(u => u[0] === n))
const ROLE = {base: 'base', badge: 'small badge', cutout: 'cut-out', part: 'part'}
const pretty = n => n.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())
const RULES = `<svg class="rules" viewBox="0 0 24 24" aria-hidden="true"><path d="${
  [...Array(25).keys()].map(i => `M${i} 0V24M0 ${i}H24`).join('')}"/><rect class="live" x="2" y="2" width="20" height="20"/></svg>`

function renderBrowse() {
  const list = visible(), px = +S.size
  const chips = Object.keys(FILTERS).map(k =>
    `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${pretty(k)}<b>${ICONS.filter(FILTERS[k]).length}</b></button>`).join('')
  const cells = list.map(i => `<button class="cell" data-n="${i.n}" aria-current="${i.n === S.sel}" title="${i.n}">
    ${i.e ? '<i class="flag err"></i>' : ''}${S.pins.includes(i.n) ? '<i class="flag pin"></i>' : ''}
    <span class="pair">${S.show === 'mdi' ? use(i.n, 'mdi', px, 'old') : ''}${use(i.n, S.variant, px)}</span>
    <span class="nm">${i.n}</span></button>`).join('')
  $('main').style.setProperty('--cell', Math.max(92, (S.show === 'mdi' ? 2 * px + 10 : px) + 56) + 'px')
  const usesChip = S.uses ? `<button class="chip on" data-clearuses title="Clear this filter">Uses ${S.uses}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg></button>` : ''
  $('main').innerHTML = `<div class="filters">${chips}${usesChip}<span class="hint"><kbd>←</kbd> <kbd>→</kbd> browse · <kbd>P</kbd> pin to compare · <kbd>/</kbd> search</span></div>` +
    (list.length ? `<div class="grid">${cells}</div>` :
      `<div class="empty"><strong>No icons match.</strong>Nothing in “${esc(pretty(S.filter))}” matches${S.q ? ` “${esc(S.q)}”` : ''}${S.uses ? ` and uses ${S.uses}` : ''}. Clear the search or pick another filter.</div>`)
}

function renderCompare() {
  if (!S.pins.length) {
    $('main').innerHTML = `<div class="empty"><strong>Nothing pinned yet.</strong>Pin icons to line them up here and judge weight, size and style against each other. In Browse, select an icon and press <kbd>P</kbd>, or use the pin button next to its name.</div>`
    return
  }
  const dark = S.stage === 'dark' ? ' dark' : ''
  const col = n => `<div class="colhead"><button data-n="${n}" title="Inspect ${n}">${n}</button>
      <button class="x" data-unpin="${n}" aria-label="Remove ${n} from compare"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg></button></div>` +
    ['mdi', 'filled', 'stroked'].map(v => `<div class="stage${dark}">${use(n, v, 96)}</div>`).join('') +
    `<div class="real"><span class="stage">${use(n, S.variant, 24)}</span><span class="stage dark">${use(n, S.variant, 24)}</span></div>`
  $('main').innerHTML = `<div class="cmp"><span></span>${['MDI', 'Filled', 'Stroked', '24 px'].map(l => `<span class="rowlab">${l}</span>`).join('')}${S.pins.map(col).join('')}</div>`
}

function renderInspector() {
  const i = byName[S.sel], v = S.stageV === 'mdi' && !i.m ? 'filled' : S.stageV
  const dark = S.stage === 'dark' ? ' dark' : '', pinned = S.pins.includes(i.n), used = usedIn(i.n)
  const chev = d => `<svg width="16" height="16" viewBox="0 0 24 24"><path d="${d}"/></svg>`
  const strip = cls => `<div class="strip ${cls}">${[16, 20, 24, 32, 48].map(px =>
    `<figure>${use(i.n, v, px)}<figcaption class="num">${px}</figcaption></figure>`).join('')}</div>`
  const tile = cls => `<div class="tilebg ${cls}"><div class="tile"><i>${use(i.n, v, 32)}</i><span><b>${esc(pretty(i.n))}</b><small>On</small></span></div></div>`
  $('ins').innerHTML = `
    <div class="ins-head">
      <div><h2>${i.n}</h2><p>${i.d ? 'Hand-drawn' : 'Derived from ' + i.b} · keyline ${i.k}</p></div>
      <div class="tools">
        <button class="tool" data-step="-1" aria-label="Previous icon">${chev('M15 6L9 12L15 18')}</button>
        <button class="tool" data-step="1" aria-label="Next icon">${chev('M9 6L15 12L9 18')}</button>
        <button class="tool" data-pin aria-pressed="${pinned}">${pinned ? 'Pinned' : 'Pin'}</button>
      </div>
    </div>
    <div class="stage big${dark}">${S.rules ? RULES : ''}${S.ghost && v !== 'mdi' ? use(i.n, 'mdi', 24, 'ghost') : ''}${use(i.n, v, 24)}</div>
    <div class="stage-opts">
      <div class="seg" data-key="stage" role="group" aria-label="Preview background"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
      <label><input type="checkbox" data-toggle="rules" ${S.rules ? 'checked' : ''}>Pixel grid</label>
      <label><input type="checkbox" data-toggle="ghost" ${S.ghost ? 'checked' : ''} ${i.m ? '' : 'disabled'}>MDI overlay</label>
    </div>
    <div class="trio">${['mdi', 'filled', 'stroked'].map(k => `<button data-stagev="${k}" aria-pressed="${k === v}" ${k === 'mdi' && !i.m ? 'disabled' : ''}>
      <span class="stage${dark}">${use(i.n, k, 56) || '<span class="none">Not in MDI</span>'}</span>${LABEL[k]}</button>`).join('')}</div>
    <section><h3>Real size · ${LABEL[v]}</h3><div class="strips">${strip('')}${strip('dark')}</div></section>
    <section><h3>In a tile card</h3><div class="tiles">${tile('')}${tile('dark')}</div></section>
    <section><h3>Built from</h3>${i.u.length ? `<div class="rel">${i.u.map(([n, r]) => byName[n]
        ? `<button class="relchip" data-n="${n}">${use(n, v === 'mdi' ? 'filled' : v, 20)}<span>${n}</span><small>${ROLE[r] || r}</small></button>`
        : `<span class="relchip missing"><span>${n}</span><small>${ROLE[r] || r} · not a standalone icon in the set</small></span>`).join('')}</div>`
      : '<p class="ok">Nothing. This icon stands on its own.</p>'}</section>
    <section><h3>Used in ${used.length || 'no'} other icon${used.length === 1 ? '' : 's'}</h3>${used.length ? `<div class="rel">${used.map(o =>
        `<button class="relchip" data-n="${o.n}">${use(o.n, v === 'mdi' ? 'filled' : v, 20)}<span>${o.n}</span><small>${ROLE[o.u.find(u => u[0] === i.n)[1]]}</small></button>`).join('')}</div>
      <button class="link" data-uses="${i.n}">Show these ${used.length} in the grid</button>` : '<p class="ok">No other icon reuses this one yet.</p>'}</section>
    <section><h3>Properties</h3><dl>
      <dt>Source</dt><dd>${i.d ? `icons/${i.n}.filled.svg, .stroked.svg` : `${i.b} + “${i.n.slice(i.b.length + 1)}” modifier`}</dd>
      <dt>Keyline</dt><dd>${i.k}</dd>
      <dt>Corner radius</dt><dd>${RADIUS} px</dd>
      <dt>Path size</dt><dd class="num">filled ${i.s[0]} · stroked ${i.s[1]}${i.m ? ` · MDI ${i.s[2]}` : ''} bytes</dd>
    </dl></section>
    <section><h3>Lint</h3>${i.t.length ? `<ul class="notes">${i.t.map(t => `<li class="${t.startsWith('ERROR') ? 'err' : ''}">${esc(t)}</li>`).join('')}</ul>`
      : '<p class="ok">No issues in either variant.</p>'}</section>`
}

function renderRules() {
  $('main').innerHTML = `<article class="doc">${$('rules').innerHTML}</article>`
}

function render(what = 'all') {
  document.documentElement.dataset.theme = S.theme
  document.querySelectorAll('.seg[data-key]').forEach(g => g.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(S[g.dataset.key]) === b.dataset.v)))
  $('pincount').textContent = S.pins.length || ''
  $('meta').textContent = `${ICONS.length} icons · ${ICONS.filter(i => i.d).length} drawn · radius ${RADIUS}`
  if (what !== 'ins') ({compare: renderCompare, rules: renderRules}[S.mode] || renderBrowse)()
  renderInspector()
  document.querySelectorAll('.seg[data-key=stage] button').forEach(b => b.setAttribute('aria-pressed', S.stage === b.dataset.v))
  try { localStorage.setItem('ha-icons-sheet', JSON.stringify(S)) } catch {}
}

function select(n, scroll) {
  S.sel = n
  document.querySelectorAll('.cell').forEach(c => c.setAttribute('aria-current', c.dataset.n === n))
  if (scroll) document.querySelector(`.cell[data-n="${n}"]`)?.scrollIntoView({block: 'nearest'})
  render('ins')
}
function step(by) {
  const list = S.mode === 'compare' ? S.pins.map(n => byName[n]) : visible()
  if (!list.length) return
  const at = list.findIndex(i => i.n === S.sel)
  select(list[(at + by + list.length) % list.length].n, true)
}
function togglePin(n) {
  S.pins = S.pins.includes(n) ? S.pins.filter(p => p !== n) : [...S.pins, n]
  render()
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-n]')
  if (!t) return
  const seg = t.closest('.seg[data-key]')
  if (seg) {
    S[seg.dataset.key] = t.dataset.v
    if (seg.dataset.key === 'variant') S.stageV = t.dataset.v
    return render()
  }
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render() }
  if (t.dataset.uses) { Object.assign(S, {uses: t.dataset.uses, mode: 'browse', filter: 'all', q: ''}); $('q').value = ''; return render() }
  if ('clearuses' in t.dataset) { S.uses = ''; return render() }
  if (t.dataset.unpin) return togglePin(t.dataset.unpin)
  if (t.dataset.step) return step(+t.dataset.step)
  if ('pin' in t.dataset) return togglePin(S.sel)
  if (t.dataset.stagev) { S.stageV = t.dataset.stagev; return render('ins') }
  if (t.dataset.n) (e.shiftKey || e.altKey) ? togglePin(t.dataset.n) : select(t.dataset.n, true)
})
document.addEventListener('change', e => {
  if (e.target.dataset.toggle) { S[e.target.dataset.toggle] = e.target.checked; render('ins') }
})
$('q').value = S.q
$('q').addEventListener('input', e => { S.q = e.target.value; render() })
document.addEventListener('keydown', e => {
  if (e.target.matches('input[type=search]')) { if (e.key === 'Escape') e.target.blur(); return }
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1) }
  else if (e.key.toLowerCase() === 'p') togglePin(S.sel)
  else if (e.key === '/') { e.preventDefault(); $('q').focus() }
})
render()
</script>
</html>
