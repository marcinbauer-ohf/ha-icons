<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA icon set preview</title>
<style>
/* Spacing scale: 4 8 12 16 24 32 48. Preview swatches keep fixed colours so icons are judged the same in either app theme. */
:root{
  --bg:#f3f2ee;--panel:#faf9f6;--surface:#fff;--ink:#1a1a18;--muted:#63625d;--line:#e0ded6;
  --accent:#1f5fd6;--accent-soft:#1f5fd618;--danger:#b3261e;--ghost:#d81b8c;
  --sw-light:#fff;--sw-light-ink:#1c1c1c;--sw-dark:#101010;--sw-dark-ink:#ececec;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#131312;--panel:#1a1a18;--surface:#222220;--ink:#eceae4;--muted:#a3a199;--line:#30302c;
  --accent:#86b0ff;--accent-soft:#86b0ff22;--danger:#ff8f85;--ghost:#ff6ec7;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}svg:not(.anim){fill:currentColor}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,dl,dd{margin:0}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding:0 24px;height:52px;border-bottom:1px solid var(--line);position:relative;z-index:3}
.bar>.seg:not(.nav){flex:none}
.bar h1{white-space:nowrap}
.logo{display:flex;margin-right:4px}
.logo .house{fill:var(--ink)}
.logo .tree{fill:var(--bg)}
.seg.nav{align-self:stretch;padding:0;background:none;border-radius:0;gap:4px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.seg.nav button{padding:0 10px;border-radius:0;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.seg.nav button[aria-pressed=true]{background:none;box-shadow:none;color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.seg.nav b{font-weight:500;font-size:11px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--line);color:var(--muted);text-align:center}
.seg.nav b:empty{display:none}
.seg.nav #issuecount{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.bar h1{font-size:15px;font-weight:650;letter-spacing:-.01em}
.bar .meta{color:var(--muted)}
.bar .grow{flex:1}
.search{width:420px;min-width:160px;flex-shrink:1;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);caret-color:var(--accent)}
.search::placeholder{color:var(--muted)}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--line)}
.seg button{padding:4px 10px;border-radius:6px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.field{display:flex;align-items:center;gap:8px;color:var(--muted)}

/* workbench */
.work{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.main{overflow:auto;padding:16px 24px 48px}
.filters{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:16px}
.hint{white-space:nowrap}
.chip{padding:4px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip b{font-weight:500;opacity:.7;margin-left:4px}
.hint{color:var(--muted);margin-top:32px}
.catsel+.catsel{margin-left:0}
.filters:has(+.filters){margin-bottom:8px}
.filters.opts{gap:4px 16px}
.fbar{position:sticky;top:-16px;z-index:2;margin:-16px -24px 16px;padding:16px 24px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.fbar .filters:last-child{margin-bottom:0}
.opt{display:flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.opts .switch{margin-left:auto}
.catsel{font:inherit;color:var(--ink);margin-left:auto;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);max-width:220px}
.switch{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;white-space:nowrap;color:var(--muted)}
.switch[aria-checked=true]{color:var(--ink)}
.switch i{position:relative;width:32px;height:20px;border-radius:999px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(12px)}
kbd{font:inherit;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

.letter{margin-bottom:20px}
.letter h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 8px}
.fams{display:flex;flex-wrap:wrap;gap:8px}
.fam{display:flex;flex-wrap:wrap;border-radius:12px;max-width:100%;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.fam .cell{width:var(--cell,92px)}
.fam .cell:hover{background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,92px),1fr));gap:4px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 8px;border-radius:10px;
  transition:background .12s}
.cell:hover{background:var(--panel)}
.cell[aria-current=true]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.cell .pair{display:flex;align-items:center;gap:10px}
.cell .old{color:var(--muted);opacity:.75}
.cell .nm{font-size:11px;color:var(--muted);text-align:center;line-height:1.25;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cell[aria-current=true] .nm{color:var(--ink)}
.cell .flag{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%}
.cell .flag.err{background:var(--danger)}
.cell .flag.pin{left:6px;right:auto;background:var(--accent)}
.cell .flag.st{right:16px;background:var(--st)}
.review{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-8px 0 16px;color:var(--muted)}
.review .st{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.review .st::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--st,var(--line))}
a.tool{text-decoration:none;color:var(--ink)}
a.tool.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.tool.primary:hover{filter:brightness(1.1)}
.review .tool{margin-left:auto}
button.tool.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.review select{font:inherit;color:var(--ink);padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.review .err,.thread .err{color:var(--danger)}
.thread{display:grid;gap:12px}
.comment{padding:10px 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.comment header{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:6px}
.comment header img{width:20px;height:20px;border-radius:50%}
.comment header b{color:var(--ink);font-weight:600}
.comment .body{overflow-wrap:anywhere}
.comment .body>*{margin:0 0 6px}.comment .body>:last-child{margin-bottom:0}
.comment .body img{max-width:100%}
.composer{display:grid;gap:8px;margin-top:16px}
.composer textarea{font:inherit;color:var(--ink);min-height:72px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.composer div{display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--muted)}
.empty{padding:48px 0;color:var(--muted);max-width:44ch}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* compare */
.cmp{display:grid;grid-auto-flow:column;grid-template-rows:auto repeat(3,auto) auto;gap:8px 12px;justify-content:start;align-items:center}
.cmp .rowlab{color:var(--muted);padding-right:8px}
.cmp .colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:148px;font-weight:600}
.cmp .colhead button:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.cmp .x{color:var(--muted);border-radius:6px;padding:2px}
.cmp .x:hover{color:var(--ink);background:var(--line)}
.cmp .stage{width:148px;height:148px;border-radius:14px}
.cmp .stage svg{width:96px;height:96px}
.cmp .real{display:flex;gap:4px;width:148px}
.cmp .real .stage{flex:1;width:auto;height:48px;border-radius:10px}
.cmp .real .stage svg{width:24px;height:24px}

/* inspector */
.ins{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:24px 24px 48px}
.ins-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.ins-head h2{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.2;overflow-wrap:anywhere}
.ins-head p{color:var(--muted);margin-top:2px}
.tools{display:flex;gap:4px;flex:none}
.tool{display:grid;place-items:center;height:30px;min-width:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tool:hover{border-color:var(--muted)}
.tool[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tool svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stage{position:relative;display:grid;place-items:center;border-radius:20px;background:var(--sw-light);color:var(--sw-light-ink);
  box-shadow:inset 0 0 0 1px #0000000f}
.stage.dark{background:var(--sw-dark);color:var(--sw-dark-ink);box-shadow:inset 0 0 0 1px #ffffff14}
.stage.big{aspect-ratio:1}
.stage.big>svg{position:absolute;inset:18%;width:64%;height:64%}
.stage .ghost{color:var(--ghost);opacity:.4}
.stage .rules{fill:none;stroke:currentColor;opacity:.16}
.stage .rules .live{stroke:var(--accent);opacity:1;stroke-dasharray:3 3}
.stage .rules *{vector-effect:non-scaling-stroke;stroke-width:1}
.stage-opts{display:flex;align-items:center;gap:12px;margin:12px 0 0;color:var(--muted)}
.stage-opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.stage-opts input{accent-color:var(--accent);margin:0}
.stage-opts .seg{margin-right:auto}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.trio button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 8px 10px;border-radius:14px;color:var(--muted)}
.trio button:hover{background:var(--surface)}
.trio button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.trio .stage{width:100%;aspect-ratio:1.4;border-radius:10px}
.trio .stage svg{width:56px;height:56px}
.trio .none{font-size:11px;opacity:.6}

.ins[data-tab=preview] [data-t]:not([data-t=preview]),.ins[data-tab=details] [data-t]:not([data-t=details]),.ins[data-tab=issues] [data-t]:not([data-t=issues]),.ins[data-tab=review] [data-t]:not([data-t=review]){display:none}
.tabs{height:36px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.tabs b:not(:empty){background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.ins section{margin-top:32px}
.ins .tabs+section,.ins[data-tab=details] section[data-t=details]:first-of-type,.ins[data-tab=issues] section[data-t=issues]:first-of-type,.ins[data-tab=review] section[data-t=review]:first-of-type{margin-top:0}
.ins h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.strips{display:grid;gap:8px}
.strip{display:flex;align-items:flex-end;justify-content:space-around;padding:20px 16px 12px;border-radius:14px;
  background:var(--sw-light);color:var(--sw-light-ink);box-shadow:inset 0 0 0 1px #0000000f}
.strip.dark{background:var(--sw-dark);color:var(--sw-dark-ink);box-shadow:inset 0 0 0 1px #ffffff14}
.strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.strip figcaption{opacity:.55}
/* Tile card, modernised: no border, 20px radius, 32px icon in a 40px rounded square, all on the 4px grid
   (Home Assistant default: 1px border, 12px radius, 24px icon in a 36px circle) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tilebg{padding:20px 16px;border-radius:14px;background:#eef0f3;color:#1c1c1c}
.tilebg.dark{background:#0c0c0d;color:#ececec}
.tile{display:flex;align-items:center;gap:12px;padding:8px;border-radius:20px;background:#fff;line-height:1.25;min-width:0}
.dark .tile{background:#1e1f22}
.tile i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#f5a524;background:#f5a52433}
.tile span{min-width:0}
.tile b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;opacity:.65}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 24px}
dt{color:var(--muted)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notes li{padding:8px 12px;border-radius:8px;background:var(--surface);overflow-wrap:anywhere}
.notes li.err{color:var(--danger)}
.ok{color:var(--muted)}

/* motion: only parts move, the body of the icon is always there (RULES.md, Motion) */
.anim [data-anim]{transform-box:view-box;transform-origin:12px 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%,45%,100%{transform:rotate(0)}6%{transform:rotate(14deg)}16%{transform:rotate(-12deg)}26%{transform:rotate(8deg)}35%{transform:rotate(-4deg)}}
@keyframes clap{0%,45%,100%{transform:translateX(0)}6%{transform:translateX(-3px)}16%{transform:translateX(3px)}26%{transform:translateX(-2px)}35%{transform:translateX(1px)}}
@keyframes wave1{0%{opacity:.25}20%,100%{opacity:1}}
@keyframes wave2{0%{opacity:.25}40%,100%{opacity:1}}
@keyframes wave3{0%{opacity:.25}60%,100%{opacity:1}}
@keyframes drop{0%,100%{transform:translateY(-2px)}55%{transform:translateY(0)}}
@keyframes toggle{0%,42%{transform:translateX(0)}50%,92%{transform:translateX(-8px)}100%{transform:translateX(0)}}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes needle{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(30deg)}}
@keyframes unlock{0%,40%,100%{transform:none}50%,90%{transform:translateY(-1px) rotate(-18deg)}}
@keyframes shine{0%,100%{stroke-dasharray:22 200;stroke-dashoffset:-39}50%{stroke-dasharray:100 200;stroke-dashoffset:0}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
@keyframes swing{0%,35%,100%{transform:scaleX(1)}50%,85%{transform:scaleX(.55)}}
@keyframes charge{0%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}
@keyframes chargefill{0%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
.anim [data-anim=needle]{animation:needle 2.8s ease-in-out infinite}
.anim [data-anim=unlock]{transform-origin:8px 10px;animation:unlock 3s cubic-bezier(.2,.8,.2,1) infinite}
.anim [data-anim=shine]{animation:shine 2.8s ease-in-out infinite}
.anim [data-anim=still]{display:none}
.anim [display=none]{display:inline}
.anim [data-anim=walk]{animation:walk 1.8s ease-in-out infinite}
.anim [data-anim=swing]{transform-origin:6px 12px;animation:swing 3.4s cubic-bezier(.3,0,.2,1) infinite}
.anim [data-anim=charge]{transform-origin:12px 7px;animation:charge 2.8s linear infinite}
.anim [data-anim=charge-fill]{transform-origin:12px 18px;animation:chargefill 2.8s linear infinite}
.anim [data-anim=spin]{animation:spin 1.6s linear infinite}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.anim [data-anim=sway]{transform-origin:11px 13px;animation:sway 3.6s ease-in-out infinite}
.anim [data-anim=brush]{transform-origin:17px 7px;animation:spin 2.4s linear infinite}
.anim [data-anim=spin-slow]{animation:spin 14s linear infinite}
.anim [data-anim=hand-m]{animation:spin 4s linear infinite}
.anim [data-anim=hand-h]{animation:spin 48s linear infinite}
.anim [data-anim=ring]{transform-origin:12px 3px;animation:ring 2.6s ease-in-out infinite}
.anim [data-anim=clapper]{animation:clap 2.6s ease-in-out infinite}
.anim [data-anim=wave-1]{animation:wave1 2s step-end infinite}
.anim [data-anim=wave-2]{animation:wave2 2s step-end infinite}
.anim [data-anim=wave-3]{animation:wave3 2s step-end infinite}
.anim [data-anim=drop]{animation:drop 1.3s cubic-bezier(.3,0,.2,1) infinite}
.anim [data-anim=toggle]{animation:toggle 3.2s cubic-bezier(.2,.8,.2,1) infinite}
.anim [data-anim=blink]{animation:blink 3.4s ease-in-out infinite}
body.paused .anim [data-anim]{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.anim [data-anim]{animation:none}}
.motion-head{display:flex;align-items:center;gap:16px;margin-bottom:24px;max-width:72ch}
.motion-head p{color:var(--muted);flex:1}
.motions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px 16px}
.motions button{display:flex;flex-direction:column;gap:12px;text-align:left;border-radius:20px;padding:4px 4px 12px}
.motions button[aria-current=true]{box-shadow:0 0 0 2px var(--accent)}
.motions .stage{aspect-ratio:1.5;border-radius:16px}
.motions .stage svg{width:96px;height:96px}
.motions .real{display:flex;gap:4px}
.motions .real .stage{flex:1;aspect-ratio:auto;height:48px;border-radius:10px}
.motions .real svg{width:24px;height:24px}
.motions b{font-weight:600;padding:0 8px}
.motions small{color:var(--muted);padding:0 8px;font-size:12px;line-height:1.4}
/* dashboard: a mock Home Assistant overview, drawn with the set */
.dashes{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.dash{--card:#fff;--page:#eef0f3;--txt:#1c1c1e;--sub:#6a6d75;--idle:#e9ebef;--idle-ink:#5b5f68;
  background:var(--page);color:var(--txt);border-radius:28px;padding:24px;container-type:inline-size}
:root[data-theme=dark] .dash{--card:#1d1e21;--page:#0c0c0d;--txt:#ececee;--sub:#a0a3ab;--idle:#2a2c30;--idle-ink:#b4b7bf}
.dash-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.dash-top h2{font-size:28px;font-weight:650;letter-spacing:-.02em}
.dash-top span{color:var(--sub)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--card);font-weight:550}
.badge svg{color:var(--c,var(--idle-ink))}
.dash-sections{display:grid;grid-template-columns:1fr;gap:28px 24px}
@container (min-width:640px){.dash-sections{grid-template-columns:1fr 1fr}}
@container (min-width:980px){.dash-sections{grid-template-columns:1fr 1fr 1fr}}
.dash h3{font-size:15px;font-weight:650;margin-bottom:12px;color:var(--txt)}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dtile{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:0 12px;padding:8px;border-radius:20px;background:var(--card);
  text-align:left;transition:transform .15s cubic-bezier(.2,.8,.2,1)}
.dtile:hover{transform:translateY(-1px)}
.dtile[aria-current=true]{box-shadow:0 0 0 2px var(--accent)}
.dtile i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--idle);color:var(--idle-ink)}
.dtile.on i{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.dtile b{display:block;font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile .lvl{grid-column:1/-1;height:6px;border-radius:3px;margin:8px 4px 2px;background:var(--idle);overflow:hidden}
.dtile .lvl::before{content:"";display:block;height:100%;width:var(--v);border-radius:3px;background:var(--c)}
.dash-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.relchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
button.relchip:hover{border-color:var(--muted)}
.relchip small{color:var(--muted)}
.relchip.missing{border-style:dashed;color:var(--muted)}
.rel+.link{margin-top:12px}
.issues h2{display:flex;align-items:center;gap:10px;margin:32px 0 4px}
.issues h2 small{color:var(--muted);font-weight:500}
.issues .sev{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.issues .sev.err{border-color:var(--danger);color:var(--danger)}
.issues .fam{margin-top:12px;width:fit-content}
.issues .notes li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}
.issues .notes{margin-top:12px}
.relchip[aria-current=true]{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.rulelist{display:grid;gap:2px}
.rulelist.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px 24px}
.rulelist button{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 10px;margin:0 -10px;border-radius:8px;text-align:left}
.rulelist button:hover{background:var(--surface)}
.rulelist small{color:var(--muted)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chip.on{background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px}
.doc{max-width:72ch;}
.doc.issues{max-width:none}
.doc.issues>p,.issues section>p{max-width:72ch}
.doc{font-size:14px;line-height:1.55;padding-bottom:48px}
.doc h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-bottom:8px;text-wrap:balance}
.doc h2{font-size:16px;font-weight:650;margin:40px 0 8px}
.doc p{color:var(--muted);margin-bottom:8px}
.doc ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.doc li{display:block;padding:8px 0;border-top:1px solid var(--line)}
.doc code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;padding:1px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.doc .how{float:right;margin-left:16px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.doc .how.lint{border-color:var(--accent);color:var(--accent)}
.doc .how.build{border-color:var(--ink);color:var(--ink)}
@media (max-width:980px){
  body{overflow:auto;display:block}
  .work{display:block}
  .main,.ins{overflow:visible}
  .ins{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true">{{defs}}</svg>

<header class="bar">
  <h1 class="logo"><svg viewBox="0 0 240 240" width="28" height="28" role="img" aria-label="Home Assistant icons">
    <path class="house" d="M240 224.762a15 15 0 0 1-15 15H15a15 15 0 0 1-15-15v-90c0-8.25 4.77-19.769 10.61-25.609l98.78-98.7805c5.83-5.83 15.38-5.83 21.21 0l98.79 98.7895c5.83 5.83 10.61 17.36 10.61 25.61v90-.01Z"/>
    <path class="tree" d="m107.27 239.762-40.63-40.63c-2.09.72-4.32 1.13-6.64 1.13-11.3 0-20.5-9.2-20.5-20.5s9.2-20.5 20.5-20.5 20.5 9.2 20.5 20.5c0 2.33-.41 4.56-1.13 6.65l31.63 31.63v-115.88c-6.8-3.3395-11.5-10.3195-11.5-18.3895 0-11.3 9.2-20.5 20.5-20.5s20.5 9.2 20.5 20.5c0 8.07-4.7 15.05-11.5 18.3895v81.27l31.46-31.46c-.62-1.96-.96-4.04-.96-6.2 0-11.3 9.2-20.5 20.5-20.5s20.5 9.2 20.5 20.5-9.2 20.5-20.5 20.5c-2.5 0-4.88-.47-7.09-1.29L129 208.892v30.88z"/>
  </svg></h1>
  <nav class="seg nav" data-key="mode" aria-label="Views"><button data-v="browse">Browse</button><button data-v="compare">Compare<b id="pincount"></b></button><button data-v="dash">Dashboard</button><button data-v="motion">Motion</button><button data-v="issues">Issues<b id="issuecount"></b></button><button data-v="rules">Rules</button></nav>
  <input class="search" id="q" type="search" placeholder="Search icons" aria-label="Search icons">

<div class="work">
  <main class="main" id="main"></main>
  <aside class="ins" id="ins" aria-label="Selected icon"></aside>
</div>

<template id="rules">{{rules}}</template>
<script>
const ICONS = {{data}}, RADIUS = "{{radius}}", ANIM = {{anim}}, RULE = {{rulelabels}}
const ruleCount = id => ICONS.filter(i => i.r.includes(id)).length
let uid = 0
// the authoring SVG, inlined so its parts can move; mask ids are made unique per copy
const moving = (n, v, px) => !ANIM[n] || v === 'mdi' ? use(n, v, px) :
  ANIM[n][v].replaceAll(`${n}-${v}-`, `${n}-${v}-${++uid}-`).replace('<svg ', `<svg class="anim" width="${px}" height="${px}" aria-hidden="true" `)
const byName = Object.fromEntries(ICONS.map(i => [i.n, i]))
const S = {sel: ICONS[0].n, mode: 'browse', variant: 'filled', show: 'new', size: '24', theme: 'light',
  filter: 'all', q: '', uses: '', rule: '', cat: '', ha: '', st: '', animate: false, group: 'family', tab: 'preview', pins: [], stageV: 'filled', stage: 'light', rules: false, ghost: false}
try { Object.assign(S, JSON.parse(localStorage.getItem('ha-icons-sheet') || '{}')) } catch {}
// Sign-in (see worker/README.md). Empty until the worker is deployed; the review then falls back to links to GitHub.
const AUTH = {client: '', worker: ''}
let token = '', ME = null, authError = ''
try { token = localStorage.getItem('ha-icons-gh') || '' } catch {}
{ // the worker sends people back with #gh_token=…&state=<nonce>.<page>.<icon>
  const h = new URLSearchParams(location.hash.slice(1))
  if (h.has('state')) {
    const [nonce, , icon] = h.get('state').split('.')
    let want = ''
    try { want = sessionStorage.getItem('ha-icons-nonce'); sessionStorage.removeItem('ha-icons-nonce') } catch {}
    if (!nonce || nonce !== want) authError = 'Sign-in could not be verified. Try again.'
    else if (h.get('gh_token')) { token = h.get('gh_token'); try { localStorage.setItem('ha-icons-gh', token) } catch {} }
    else authError = h.get('gh_error') || 'Sign-in failed.'
    history.replaceState(null, '', location.pathname + location.search + '#' + (icon || ''))
  }
}
if (byName[decodeURIComponent(location.hash.slice(1))]) S.sel = decodeURIComponent(location.hash.slice(1))  // #name links to one icon
if (!byName[S.sel]) S.sel = ICONS[0].n
S.pins = S.pins.filter(n => byName[n])

const $ = id => document.getElementById(id)
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))
const use = (n, v, px, cls = '') => v === 'mdi' && !byName[n].m ? '' :
  `<svg class="${cls}" width="${px}" height="${px}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${n}-${v}"/></svg>`
const LABEL = {mdi: 'MDI', filled: 'Filled', stroked: 'Stroked'}
const FILTERS = {all: () => true, drawn: i => i.d, derived: i => !i.d, animated: i => i.a, proposals: i => i.p, issues: i => i.t.some(isProblem)}
const seg = (key, label, opts) => `<span class="opt">${label}<span class="seg" data-key="${key}" role="group" aria-label="${label}">${
  opts.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</span></span>`
const MDIOPT = seg('show', 'Compare with', [['new', 'Nothing'], ['mdi', 'MDI']])
// variant and app theme sit in every view's options row
const LOOK = seg('variant', 'Variant', [['filled', 'Filled'], ['stroked', 'Stroked']]) + seg('theme', 'Theme', [['light', 'Light'], ['dark', 'Dark']])
const NOCAT = 'Uncategorised'
const catsOf = i => i.g ? (i.g.categories.length ? i.g.categories : [NOCAT]) : []
const CATS = [...new Set(ICONS.flatMap(catsOf))].sort((a, b) => (a === NOCAT) - (b === NOCAT) || a.localeCompare(b))
// search matches the name and Pictogrammers' aliases ("notifications" finds bell)
// Home Assistant tags: every "domain", "domain.x" or "domain: state" string an icon carries
const HAKEYS = {domain: 'Default icon for', device_class: 'Device class', state: 'State', action: 'Action', trigger: 'Trigger', condition: 'Condition', entity: 'Integration entities'}
const haTags = i => Object.keys(HAKEYS).filter(k => k !== 'entity').flatMap(k => i.h[k] || [])
const haDomain = t => t.split(/[.:]/)[0]
const HADOMAINS = [...new Set(ICONS.flatMap(i => ['domain', 'device_class', 'state'].flatMap(k => i.h[k] || []).map(haDomain)))].sort()
const inHa = (i, d) => haTags(i).some(t => haDomain(t) === d)
// search matches the name, Pictogrammers' aliases ("notifications" finds bell) and Home Assistant tags ("vacuum.start" finds play)
const matches = (i, q) => !q || i.n.includes(q) || (i.g && i.g.aliases.some(a => a.includes(q))) || haTags(i).some(t => t.includes(q))
const visible = () => ICONS.filter(i => FILTERS[S.filter](i) && matches(i, S.q.trim().toLowerCase()) && (!S.cat || catsOf(i).includes(S.cat)) && (!S.ha || inHa(i, S.ha)) &&
  (!S.uses || i.u.some(u => u[0] === S.uses)) && (!S.rule || i.r.includes(S.rule)) && (!S.st || stOf(i.n) === (S.st === '-' ? '' : S.st)))
// Review: each icon's discussion is a GitHub issue titled with its name and labelled "icon"; its "status: …" label is the stage.
// Read without signing in (60 requests an hour per visitor); everything is written on GitHub.
const REPO = 'marcinbauer-ohf/ha-icons', SITE = 'https://marcinbauer-ohf.github.io/ha-icons/'
const STATUS = {'': ['Not reviewed', ''], draft: ['Draft', '#8b8d94'], 'in progress': ['In progress', '#2b9af9'],
  'needs changes': ['Needs changes', '#f76b15'], approved: ['Approved', '#2f9e44'], shipped: ['Shipped', '#8e5cf7']}
let REVIEW = {}, reviewError = '', reviewedAt = 0, reviewNote = ''
const COMMENTS = {}, DRAFT = {}  // issue number -> comments (or 'loading' / Error); icon -> unsent comment
const stOf = n => REVIEW[n]?.status || ''
// GitHub REST, signed in when there is a token (5000 requests an hour instead of 60); bodies come back as GitHub's sanitised HTML
async function gh(path, method = 'GET', body) {
  const r = await fetch('https://api.github.com' + path, {method, body: body && JSON.stringify(body),
    headers: {Accept: 'application/vnd.github.html+json', ...(token ? {Authorization: 'Bearer ' + token} : {}), ...(body ? {'Content-Type': 'application/json'} : {})}})
  if (r.status === 401 && token) { signOut(); throw Object.assign(new Error('Your sign-in expired. Sign in again.'), {status: 401}) }
  if (!r.ok) throw Object.assign(new Error(r.status === 403 && !token ? 'GitHub rate limit reached, try again in a while' : `GitHub said ${r.status}`), {status: r.status})
  return r.status === 204 ? null : r.json()
}
const issueOf = x => {
  const st = x.labels.map(l => l.name).find(l => l.startsWith('status: '))?.slice(8) || ''
  return {status: st in STATUS ? st : '', comments: x.comments, url: x.html_url, open: x.state === 'open', number: x.number}
}
function signIn() {
  const nonce = crypto.randomUUID().replaceAll('-', '')
  try { sessionStorage.setItem('ha-icons-nonce', nonce) } catch {}
  const page = location.origin === 'http://localhost:8765' ? 1 : 0  // index into the worker's allowlist
  location.href = 'https://github.com/login/oauth/authorize?' + new URLSearchParams({client_id: AUTH.client, redirect_uri: AUTH.worker + '/callback', state: `${nonce}.${page}.${S.sel}`})
}
function signOut() { token = ''; ME = null; try { localStorage.removeItem('ha-icons-gh') } catch {}; render('ins') }
async function loadMe() { if (token) try { ME = await gh('/user'); render('ins') } catch {} }
// the issue for an icon, opened on first use; GitHub drops the labels silently for people without triage access
async function issueFor(n, status = 'draft') {
  if (REVIEW[n]) return REVIEW[n]
  const x = await gh(`/repos/${REPO}/issues`, 'POST', {title: n, labels: ['icon', 'status: ' + status],
    body: `Review of **${n}**: ${SITE}#${n}\n\nStatus is the \`status: …\` label (draft, in progress, needs changes, approved, shipped).`})
  if (!x.labels.some(l => l.name === 'icon')) reviewNote = 'GitHub opened the issue without its labels, so it will not show up here. Ask a maintainer for triage access.'
  return REVIEW[n] = issueOf(x)
}
async function setStatus(n, st) {
  reviewNote = ''
  try {
    const had = REVIEW[n]
    const x = await issueFor(n, st || 'draft')
    if (had) {
      if (x.status) await gh(`/repos/${REPO}/issues/${x.number}/labels/${encodeURIComponent('status: ' + x.status)}`, 'DELETE').catch(e => { if (e.status !== 404) throw e })
      if (st) await gh(`/repos/${REPO}/issues/${x.number}/labels`, 'POST', {labels: ['status: ' + st]})
    }
    x.status = st
  } catch (e) { reviewNote = e.status === 403 || e.status === 404 ? 'You can comment, but changing the status needs triage access to the repo.' : e.message }
  render()
}
async function loadComments(x) {
  COMMENTS[x.number] = 'loading'
  try { COMMENTS[x.number] = await gh(`/repos/${REPO}/issues/${x.number}/comments?per_page=100`) } catch (e) { COMMENTS[x.number] = e }
  render('ins')
}
async function postComment(n) {
  const text = (DRAFT[n] || '').trim()
  if (!text) return
  reviewNote = ''
  try {
    const x = await issueFor(n)
    const c = await gh(`/repos/${REPO}/issues/${x.number}/comments`, 'POST', {body: text})
    if (Array.isArray(COMMENTS[x.number])) COMMENTS[x.number].push(c); else COMMENTS[x.number] = [c]
    x.comments++
    DRAFT[n] = ''
  } catch (e) { reviewNote = e.message }
  render()
}
async function loadReviews() {
  if (Date.now() - reviewedAt < 30000) return  // spare the rate limit when flicking between tabs
  reviewedAt = Date.now()
  try {
    const got = {}
    for (let page = 1; ; page++) {
      const list = await gh(`/repos/${REPO}/issues?labels=icon&state=all&per_page=100&page=${page}`)
      // oldest first, so the newest open issue for a name wins
      for (const x of list.filter(x => !x.pull_request).reverse()) {
        const n = x.title.trim(), have = got[n]
        if (have && have.open && x.state !== 'open') continue
        got[n] = issueOf(x)
      }
      if (list.length < 100) break
    }
    REVIEW = got; reviewError = ''
    for (const k in COMMENTS) delete COMMENTS[k]  // refetched when the Review tab is next open
  } catch (e) { reviewError = e.message }
  render()
}
const newIssue = n => `https://github.com/${REPO}/issues/new?` + new URLSearchParams({title: n, labels: 'icon,status: draft',
  body: `Review of **${n}**: ${SITE}#${n}\n\nStatus is the \`status: …\` label (draft, in progress, needs changes, approved, shipped).`})
const usedIn = n => ICONS.filter(i => i.u.some(u => u[0] === n))
const ROLE = {base: 'base', badge: 'small badge', cutout: 'cut-out', part: 'part'}
const pretty = n => n.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())
const RULES = `<svg class="rules" viewBox="0 0 24 24" aria-hidden="true"><path d="${
  [...Array(25).keys()].map(i => `M${i} 0V24M0 ${i}H24`).join('')}"/><rect class="live" x="2" y="2" width="20" height="20"/></svg>`

// family = the base icon an icon is built on, followed up the chain (bell-alert and bell-off belong to bell)
const famOf = i => { const b = i.u.find(u => u[1] === 'base' && byName[u[0]]); return b && b[0] !== i.n ? famOf(byName[b[0]]) : i.n }
ICONS.forEach(i => { i.f = famOf(i) })
// the icons to show, in the order they are drawn: grouped by family, or plain A to Z
function ordered() {
  const list = visible().sort((a, b) => a.n.localeCompare(b.n))
  return S.group === 'az' ? list : list.sort((a, b) => a.f.localeCompare(b.f) || (b.n === b.f) - (a.n === a.f) || a.n.localeCompare(b.n))
}
// one icon in a grid: Browse and Issues draw the same cell; v picks the variant, tip adds to the tooltip
const iconCell = (i, px, v = S.variant, tip = '') => `<button class="cell" data-n="${i.n}" aria-current="${i.n === S.sel}" title="${esc(i.n + (tip ? ' · ' + tip : ''))}">
    ${i.e ? '<i class="flag err"></i>' : ''}${S.pins.includes(i.n) ? '<i class="flag pin" title="In compare"></i>' : ''}${stOf(i.n) ? `<i class="flag st" style="--st:${STATUS[stOf(i.n)][1]}" title="${STATUS[stOf(i.n)][0]}"></i>` : ''}
    <span class="pair">${S.show === 'mdi' ? use(i.n, 'mdi', px, 'old') : ''}${S.animate ? moving(i.n, v, px) : use(i.n, v, px)}</span>
    <span class="nm">${i.n}</span></button>`
function renderBrowse() {
  const list = ordered(), px = +S.size
  const chips = Object.keys(FILTERS).map(k =>
    `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${pretty(k)}<b>${ICONS.filter(FILTERS[k]).length}</b></button>`).join('')
  const cell = i => iconCell(i, px)
  let body
  if (S.group === 'az') body = `<div class="grid">${list.map(cell).join('')}</div>`
  else {
    const letters = new Map()
    for (const i of list) {
      const fams = letters.get(i.f[0]) || letters.set(i.f[0], new Map()).get(i.f[0])
      ;(fams.get(i.f) || fams.set(i.f, []).get(i.f)).push(i)
    }
    body = [...letters].map(([letter, fams]) => `<section class="letter"><h3>${letter}</h3><div class="fams">${
      [...fams.values()].map(m => `<div class="fam">${m.map(cell).join('')}</div>`).join('')}</div></section>`).join('')
  }
  $('main').style.setProperty('--cell', Math.max(92, (S.show === 'mdi' ? 2 * px + 10 : px) + 56) + 'px')
  const x = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg>'
  const active = (S.uses ? `<button class="chip on" data-clearuses title="Clear this filter">Uses ${S.uses}${x}</button>` : '') +
    (S.rule ? `<button class="chip on" data-clearrule title="Clear this filter">Rule: ${RULE[S.rule]}${x}</button>` : '')
  $('main').innerHTML = `<div class="fbar"><div class="filters">${chips}${active}<select class="catsel" id="st" aria-label="Review status"><option value="">All review states</option>${Object.entries(STATUS).map(([k, [t]]) =>
      `<option value="${k || '-'}" ${(k || '-') === S.st ? 'selected' : ''}>${t} (${ICONS.filter(i => stOf(i.n) === k).length})</option>`).join('')}</select><select class="catsel" id="ha" aria-label="Home Assistant domain"><option value="">All HA domains</option>${HADOMAINS.map(d =>
      `<option ${d === S.ha ? 'selected' : ''} value="${d}">${d} (${ICONS.filter(i => inHa(i, d)).length})</option>`).join('')}</select><select class="catsel" id="cat" aria-label="Pictogrammers category"><option value="">All categories</option>${CATS.map(c =>
      `<option value="${esc(c)}" ${c === S.cat ? 'selected' : ''}>${esc(c)} (${ICONS.filter(i => catsOf(i).includes(c)).length})</option>`).join('')}</select></div><div class="filters opts">${seg('size', 'Size', [20, 24, 32, 48].map(n => [n, n]))}${seg('group', 'Order', [['family', 'Families'], ['az', 'A to Z']])}${MDIOPT}${LOOK}<button class="switch" data-animate role="switch" aria-checked="${S.animate}" title="Play the moving parts of every icon that has them"><i></i>Play motion</button></div></div>` +
    (list.length ? body + `<p class="hint"><kbd>←</kbd> <kbd>→</kbd> step through icons · <kbd>P</kbd> add to compare · shift-click also adds · <kbd>/</kbd> search<br>${ICONS.length} icons, ${ICONS.filter(i => i.d).length} hand-drawn. Corner radius ${RADIUS} px, set when the set is built.</p>` :
      `<div class="empty"><strong>No icons match.</strong>Nothing in “${esc(pretty(S.filter))}” matches${S.q ? ` “${esc(S.q)}”` : ''}${S.uses ? ` and uses ${S.uses}` : ''}${S.rule ? ` and follows “${RULE[S.rule]}”` : ''}${S.cat ? ` in ${esc(S.cat)}` : ''}${S.ha ? ` for the ${S.ha} domain` : ''}. Clear the search or pick another filter.</div>`)
}

function renderCompare() {
  if (!S.pins.length) {
    $('main').innerHTML = `<div class="empty"><strong>Nothing to compare yet.</strong>Add icons to line them up here and judge weight, size and style against each other. In Browse, select an icon and press <kbd>P</kbd>, or use Add to compare next to its name.</div>`
    return
  }
  const dark = S.stage === 'dark' ? ' dark' : ''
  const col = n => `<div class="colhead"><button data-n="${n}" title="Inspect ${n}">${n}</button>
      <button class="x" data-unpin="${n}" aria-label="Remove ${n} from compare"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg></button></div>` +
    ['mdi', 'filled', 'stroked'].map(v => `<div class="stage${dark}">${use(n, v, 96)}</div>`).join('') +
    `<div class="real"><span class="stage">${use(n, S.variant, 24)}</span><span class="stage dark">${use(n, S.variant, 24)}</span></div>`
  $('main').innerHTML = `<div class="cmp"><span></span>${['MDI', 'Filled', 'Stroked', '24 px'].map(l => `<span class="rowlab">${l}</span>`).join('')}${S.pins.map(col).join('')}</div>`
}

function renderInspector() {
  const i = byName[S.sel], v = S.stageV === 'mdi' && !i.m ? 'filled' : S.stageV
  const dark = S.stage === 'dark' ? ' dark' : '', pinned = S.pins.includes(i.n), used = usedIn(i.n)
  const probs = i.t.filter(isProblem), notes = i.t.filter(t => !isProblem(t))
  const chev = d => `<svg width="16" height="16" viewBox="0 0 24 24"><path d="${d}"/></svg>`
  const strip = cls => `<div class="strip ${cls}">${[16, 20, 24, 32, 48].map(px =>
    `<figure>${use(i.n, v, px)}<figcaption class="num">${px}</figcaption></figure>`).join('')}</div>`
  const tile = cls => `<div class="tilebg ${cls}"><div class="tile"><i>${(S.animate ? moving : use)(i.n, v, 32)}</i><span><b>${esc(pretty(i.n))}</b><small>On</small></span></div></div>`
  $('ins').innerHTML = `
    <div class="ins-head">
      <div><h2>${i.n}</h2><p>${i.p ? 'Proposal, not in the set' : i.d ? 'Hand-drawn' : 'Derived from ' + i.b} · keyline ${i.k}</p></div>
      <div class="tools">
        <button class="tool" data-step="-1" aria-label="Previous icon">${chev('M15 6L9 12L15 18')}</button>
        <button class="tool" data-step="1" aria-label="Next icon">${chev('M9 6L15 12L9 18')}</button>
        <button class="tool" data-pin aria-pressed="${pinned}">${pinned ? 'In compare' : 'Add to compare'}</button>
      </div>
    </div>
    <div class="review">${reviewRow(i.n)}</div>
    <div class="seg nav tabs" data-key="tab" role="tablist"><button data-v="preview">Preview</button><button data-v="details">Details</button><button data-v="issues">Issues<b>${probs.length || ''}</b></button><button data-v="review">Review<b>${REVIEW[i.n]?.comments || ''}</b></button></div>
    ${reviewTab(i.n)}
    <div data-t="preview" class="stage big${dark}">${S.rules ? RULES : ''}${S.ghost && v !== 'mdi' ? use(i.n, 'mdi', 24, 'ghost') : ''}${(S.animate ? moving : use)(i.n, v, 24)}</div>
    <div data-t="preview" class="stage-opts">
      <div class="seg" data-key="stage" role="group" aria-label="Preview background"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
      <label><input type="checkbox" data-toggle="rules" ${S.rules ? 'checked' : ''}>Pixel grid</label>
      <label><input type="checkbox" data-toggle="ghost" ${S.ghost ? 'checked' : ''} ${i.m ? '' : 'disabled'}>MDI overlay</label>
    </div>
    <div data-t="preview" class="trio">${['mdi', 'filled', 'stroked'].map(k => `<button data-stagev="${k}" aria-pressed="${k === v}" ${k === 'mdi' && !i.m ? 'disabled' : ''}>
      <span class="stage${dark}">${use(i.n, k, 56) || '<span class="none">Not in MDI</span>'}</span>${LABEL[k]}</button>`).join('')}</div>
    <section data-t="preview"><h3>Real size · ${LABEL[v]}</h3><div class="strips">${strip('')}${strip('dark')}</div></section>
    <section data-t="preview"><h3>In a tile card</h3><div class="tiles">${tile('')}${tile('dark')}</div></section>
    ${i.a ? `<section data-t="preview"><h3>Motion</h3><div class="strips"><div class="strip${dark}"><figure>${moving(i.n, v === 'mdi' ? 'filled' : v, 64)}</figure></div></div>
      <p class="ok" style="margin-top:8px">${esc(i.a)}.</p></section>` : ''}
    <section data-t="details"><h3>Built from</h3>${i.u.length ? `<div class="rel">${i.u.map(([n, r]) => byName[n]
        ? `<button class="relchip" data-n="${n}">${use(n, v === 'mdi' ? 'filled' : v, 20)}<span>${n}</span><small>${ROLE[r] || r}</small></button>`
        : `<span class="relchip missing"><span>${n}</span><small>${ROLE[r] || r} · not a standalone icon in the set</small></span>`).join('')}</div>`
      : '<p class="ok">Nothing. This icon stands on its own.</p>'}</section>
    <section data-t="details"><h3>Used in ${used.length || 'no'} other icon${used.length === 1 ? '' : 's'}</h3>${used.length ? `<div class="rel">${used.map(o =>
        `<button class="relchip" data-n="${o.n}">${use(o.n, v === 'mdi' ? 'filled' : v, 20)}<span>${o.n}</span><small>${ROLE[o.u.find(u => u[0] === i.n)[1]]}</small></button>`).join('')}</div>
      <button class="link" data-uses="${i.n}">Show these ${used.length} in the grid</button>` : '<p class="ok">No other icon reuses this one yet.</p>'}</section>
    <section data-t="details"><h3>Rules applied</h3><div class="rulelist">${i.r.map(id =>
      `<button data-rule="${id}" title="Show every icon that uses this rule"><span>${RULE[id]}</span><small class="num">${ruleCount(id)}</small></button>`).join('')}</div></section>
    <section data-t="details"><h3>Home Assistant</h3>${Object.keys(i.h).length ? `<dl>${Object.keys(HAKEYS).filter(k => i.h[k]).map(k =>
      `<dt>${HAKEYS[k]}</dt><dd>${esc(i.h[k].join(', '))}</dd>`).join('')}
      ${i.h.integrations ? `<dt>Integrations</dt><dd class="num">${i.h.integrations}</dd>` : ''}
      <dt>Frontend</dt><dd>${i.h.ui ? 'Used directly in the interface' : 'Not used directly'}</dd>
      ${i.h.code ? `<dt>Core code</dt><dd>Set directly in core Python</dd>` : ''}
    </dl>` : '<p class="ok">Home Assistant does not use this icon by default.</p>'}</section>
    <section data-t="details"><h3>Pictogrammers</h3>${i.g ? `<dl>
      <dt>Categories</dt><dd class="rel">${catsOf(i).map(c => `<button class="relchip" data-cat="${esc(c)}" title="Show every icon in this category">${esc(c)}</button>`).join('')}</dd>
      <dt>Aliases</dt><dd>${i.g.aliases.length ? esc(i.g.aliases.join(', ')) : 'None'}</dd>
      <dt>Author</dt><dd>${esc(i.g.author)}</dd>
      <dt>Added in</dt><dd class="num">MDI ${esc(i.g.version)}</dd>
      <dt>Codepoint</dt><dd class="num">${esc(i.g.codepoint)}${i.g.deprecated ? ' · deprecated' : ''}</dd>
    </dl>` : `<p class="ok">${i.p ? 'A proposal has no Pictogrammers record.' : 'This name is not in the Pictogrammers library.'}</p>`}</section>
    <section data-t="details"><h3>Properties</h3><dl>
      <dt>Source</dt><dd>${i.d ? `icons/${i.n}.filled.svg, .stroked.svg` : `${i.b} + “${i.n.slice(i.b.length + 1)}” modifier`}</dd>
      <dt>Keyline</dt><dd>${i.k}</dd>
      <dt>Corner radius</dt><dd>${RADIUS} px</dd>
      <dt>Path size</dt><dd class="num">filled ${i.s[0]} · stroked ${i.s[1]}${i.m ? ` · MDI ${i.s[2]}` : ''} bytes</dd>
    </dl></section>
    <section data-t="issues"><h3>Problems</h3>${probs.length ? `<ul class="notes">${probs.map(t => `<li class="${t.startsWith('ERROR') ? 'err' : ''}">${esc(t)}</li>`).join('')}</ul>`
      : '<p class="ok">None in either variant.</p>'}</section>
    ${notes.length ? `<section data-t="issues"><h3>Notes</h3><ul class="notes">${notes.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>` : ''}`
  $('ins').dataset.tab = S.tab
  const x = REVIEW[i.n]
  if (S.tab === 'review' && x && x.comments && !COMMENTS[x.number]) loadComments(x)  // only when the tab is open: arrow keys re-render often
}
const signedIn = () => AUTH.client && token
// status and the one action that matters next, under the icon's name
function reviewRow(n) {
  const x = REVIEW[n], st = stOf(n)
  const badge = `<span class="st" style="--st:${STATUS[st][1]}">${STATUS[st][0]}${x && !x.open ? ' · closed' : ''}</span>`
  if (reviewError && !signedIn()) return `Review status unavailable: ${esc(reviewError)}`
  if (signedIn()) return `<select id="setst" aria-label="Review status">${Object.entries(STATUS).filter(([k]) => k || !x).map(([k, [t]]) =>
      `<option value="${k}" ${k === st ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <button class="tool" data-v="review" data-gotab>${x?.comments ? `${x.comments} comment${x.comments === 1 ? '' : 's'}` : 'Comment'}</button>${reviewNote ? `<p class="err">${esc(reviewNote)}</p>` : ''}`
  if (AUTH.client) return `${badge}<button class="tool primary" data-signin>Sign in with GitHub to review</button>${authError ? `<p class="err">${esc(authError)}</p>` : ''}`
  return x ? `${badge}<a class="tool" href="${x.url}" target="_blank" rel="noopener">${x.comments ? `${x.comments} comment${x.comments === 1 ? '' : 's'}` : 'Discuss'} on GitHub</a>`
    : `${badge}<a class="tool primary" href="${newIssue(n)}" target="_blank" rel="noopener">Start a review on GitHub</a>`
}
function reviewTab(n) {
  const x = REVIEW[n], list = x && COMMENTS[x.number]
  const thread = !x || !x.comments && !Array.isArray(list) ? '<p class="ok">No comments yet.</p>'
    : list === 'loading' || !list ? '<p class="ok">Loading comments…</p>'
    : list instanceof Error ? `<p class="err">Could not load comments: ${esc(list.message)}</p>`
    : list.map(c => `<article class="comment"><header><img src="${esc(c.user.avatar_url)}&s=40" alt=""><b>${esc(c.user.login)}</b>
        <time datetime="${c.created_at}">${new Date(c.created_at).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'})}</time></header>
        <div class="body">${c.body_html}</div></article>`).join('')  // body_html is sanitised by GitHub
  const composer = signedIn() ? `<div class="composer"><textarea id="draft" placeholder="Leave a comment on ${n}" aria-label="Comment">${esc(DRAFT[n] || '')}</textarea>
      <div><span>${ME ? `Signed in as ${esc(ME.login)} · <button class="link" data-signout>Sign out</button>` : ''}</span><button class="tool primary" data-post>Comment</button></div></div>`
    : AUTH.client ? `<div class="composer"><div><span>Sign in to comment and change the status.</span><button class="tool primary" data-signin>Sign in with GitHub</button></div></div>`
    : `<div class="composer"><div><span>Comments are written on GitHub.</span><a class="tool" href="${x ? x.url : newIssue(n)}" target="_blank" rel="noopener">${x ? 'Comment' : 'Start a review'} on GitHub</a></div></div>`
  return `<section data-t="review"><div class="thread">${thread}</div>${composer}${x ? `<p class="ok" style="margin-top:12px"><a class="link" href="${x.url}" target="_blank" rel="noopener">Open the issue on GitHub</a></p>` : ''}</section>`
}

// [icon, name, state, tone, level%] - tone decides the colour; no tone means idle
const TONE = {light: '#f5a524', heat: '#f76b15', cool: '#2b9af9', media: '#8e5cf7', cover: '#12a594', ok: '#2f9e44', warn: '#e5484d', power: '#e9a100'}
const DASH = {
  badges: [['lightbulb', '3 lights on', 'light'], ['thermometer', '21.5 °C', 'heat'], ['lock', 'Locked', 'ok'], ['motion-sensor', 'Motion in hallway', 'warn'], ['flash', '1.4 kW', 'power']],
  sections: [
    ['Favourites', [['lightbulb', 'Living room lights', 'On · 80%', 'light', 80], ['thermostat', 'Thermostat', 'Heating · 21.5 °C', 'heat'],
      ['lock', 'Front door', 'Locked', 'ok'], ['shield-check', 'Alarm', 'Armed home', 'ok']]],
    ['Living room', [['lightbulb', 'Ceiling', 'On · 80%', 'light', 80], ['lightbulb', 'Floor lamp', 'Off'], ['television', 'TV', 'Playing', 'media'],
      ['speaker', 'Speaker', 'Idle'], ['blinds', 'Blinds', 'Open · 60%', 'cover', 60], ['motion-sensor', 'Motion', 'Clear']]],
    ['Kitchen', [['lightbulb', 'Worktop', 'On · 45%', 'light', 45], ['power-socket', 'Coffee machine', 'On · 1.2 kW', 'power'], ['thermometer', 'Temperature', '22.1 °C'],
      ['water', 'Humidity', '48%'], ['fan', 'Extractor', 'Off'], ['window-closed', 'Window', 'Closed']]],
    ['Bedroom', [['lightbulb', 'Bedside', 'Off'], ['fan', 'Ceiling fan', 'On · Low', 'cool'], ['blinds', 'Blinds', 'Closed'],
      ['thermometer', 'Temperature', '19.4 °C'], ['door', 'Door', 'Closed'], ['robot-vacuum', 'Vacuum', 'Docked']]],
    ['Security', [['lock', 'Front door', 'Locked', 'ok'], ['lock-open', 'Garage', 'Unlocked', 'warn'], ['cctv', 'Driveway', 'Recording', 'media'],
      ['motion-sensor', 'Hallway', 'Detected', 'warn'], ['door', 'Back door', 'Open', 'warn'], ['bell', 'Doorbell', 'Idle']]],
    ['Energy and system', [['flash', 'Power now', '1.4 kW', 'power'], ['battery', 'Home battery', '76%', 'ok', 76], ['white-balance-sunny', 'Solar', '3.1 kW', 'light'],
      ['wifi', 'Network', 'Online', 'ok'], ['harddisk', 'Storage', '62% used'], ['download', 'Updates', '2 available', 'cool']]],
  ],
}
function dashboard(v, label) {
  const tile = ([n, name, state, tone, lvl]) => !byName[n] ? '' :
    `<button class="dtile${tone ? ' on' : ''}" data-n="${n}" aria-current="${n === S.sel}" style="--c:${TONE[tone] || ''}${lvl ? `;--v:${lvl}%` : ''}" title="${n}">
      <i>${tone ? moving(n, v, 32) : use(n, v, 32)}</i><span><b>${name}</b><small>${state}</small></span>${lvl ? '<span class="lvl"></span>' : ''}</button>`
  return `<div><p class="dash-label">${label}</p><div class="dash">
    <div class="dash-top"><h2>Home</h2><span>Wednesday, 25 November</span></div>
    <div class="badges">${DASH.badges.filter(b => byName[b[0]]).map(([n, text, tone]) =>
      `<span class="badge" style="--c:${TONE[tone]}">${use(n, v, 20)}${text}</span>`).join('')}</div>
    <div class="dash-sections">${DASH.sections.map(([title, tiles]) =>
      `<section><h3>${title}</h3><div class="dtiles">${tiles.map(tile).join('')}</div></section>`).join('')}</div>
  </div></div>`
}
function renderDash() {
  $('main').innerHTML = `<div class="dashes">${dashboard(S.variant, LABEL[S.variant] + ' set')}${S.show === 'mdi' ? dashboard('mdi', 'Material Design Icons') : ''}</div>`
}

function renderMotion() {
  const v = S.variant, list = ICONS.filter(i => i.a)
  $('main').innerHTML = `<div class="motion-head"><p>${list.length} icons with moving parts. The body of each icon stays put; only the part that explains what the thing does moves.</p>
      <button class="tool" data-pause aria-pressed="${document.body.classList.contains('paused')}">Pause</button></div>
    <div class="motions">${list.map(i => `<button data-n="${i.n}" aria-current="${i.n === S.sel}">
      <span class="stage${S.stage === 'dark' ? ' dark' : ''}">${moving(i.n, v, 96)}</span>
      <span class="real"><span class="stage">${moving(i.n, v, 24)}</span><span class="stage dark">${moving(i.n, v, 24)}</span></span>
      <b>${i.n}</b><small>${esc(i.a)}</small></button>`).join('')}</div>`
}

// what counts as a problem to fix, in the order the worklist shows it; everything else in the lint notes is a note
const KINDS = [
  [/^ERROR \w+: a gap or cut-out is under 1 px/, 'err', 'Gap or cut-out under 1 px', 'Two parts, or the two sides of a cut-out, sit closer than 1 px. Fails the build.'],
  [/^ERROR \w+: (cut-out|fragment) at/, 'err', 'Cut-out or fragment under 2 x 2 px', 'Too small to render cleanly at 24 px. Fails the build.'],
  [/^ERROR \w+: paint/, 'err', 'Paint outside the live area', 'Reaches past the padding without an overflow note. Fails the build.'],
  [/^ERROR/, 'err', 'Other lint errors', 'Fails the build.'],
  [/only nicks the base/, 'warn', 'Badge cut only nicks the base', 'The cut takes a sliver of the icon. Needs a hand-drawn version.'],
  [/cut-out was filled in/, 'warn', 'Cut-out lost to a badge', 'Less than half of a cut-out would survive next to the badge, so it was filled in. Check the icon still reads.'],
  [/sharp outer corner/, 'warn', 'Sharp outer corner', 'A convex corner on the silhouette is not rounded.'],
]
const kindOf = t => KINDS.findIndex(k => k[0].test(t))
const isWaived = t => t.startsWith('waived ')
const isProblem = t => !isWaived(t) && kindOf(t) >= 0
const problemIcons = () => ICONS.filter(i => i.t.some(isProblem))
function renderIssues() {
  const groups = KINDS.map(() => new Map())
  for (const i of ICONS) for (const t of i.t) {
    const k = kindOf(t)
    if (k >= 0) (groups[k].get(i.n) || groups[k].set(i.n, new Set()).get(i.n)).add(/filled/.test(t.split(':')[0]) ? 'filled' : 'stroked')
  }
  const total = problemIcons().length
  const waivedIcons = ICONS.filter(i => i.t.some(isWaived))
  const waivedHtml = !waivedIcons.length ? '' : `<section><h2><span class="sev">Waived</span>Rules knowingly not applied<small class="num">${waivedIcons.length}</small></h2>
    <p>Listed in <code>waivers.json</code>. These do not fail the build. Hover an icon for the reason.</p><div class="fam">${waivedIcons.map(i =>
      iconCell(i, 24, S.variant, i.t.filter(isWaived).map(t => t.replace(/^waived \w+: /, '')).filter((t, k, a) => a.indexOf(t) === k).join(' '))).join('')}</div></section>`
  $('main').innerHTML = !total && !waivedHtml ? `<div class="empty"><strong>Nothing to fix.</strong>Every icon passes lint in both variants and no badge cut is flagged.</div>` :
    `<div class="doc issues"><p>${total || 'No'} icon${total === 1 ? '' : 's'} need attention. Errors fail the build; warnings are icons the build could not derive cleanly.</p>${
      KINDS.map(([, sev, title, why], k) => !groups[k].size ? '' : `<section><h2><span class="sev ${sev}">${sev === 'err' ? 'Error' : 'Warning'}</span>${title}<small class="num">${groups[k].size}</small></h2><p>${why}</p>
        <div class="fam">${[...groups[k]].map(([n, vs]) => iconCell(byName[n], 24, vs.has(S.variant) ? S.variant : [...vs][0], [...vs].join(' + '))).join('')}</div></section>`).join('')}${waivedHtml}</div>`
}

function renderRules() {
  const used = Object.keys(RULE).filter(ruleCount)
  $('main').innerHTML = `<article class="doc"><h2 style="margin-top:0">Rules in use</h2>
    <p>What the build can see each icon doing. Pick one to list the icons that use it.</p>
    <div class="rulelist wide">${used.map(id => `<button data-rule="${id}"><span>${RULE[id]}</span><small class="num">${ruleCount(id)}</small></button>`).join('')}</div>
    <div style="height:48px"></div>${$('rules').innerHTML}</article>`
}

function sync() {
  document.querySelectorAll('.seg[data-key]').forEach(g => g.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(S[g.dataset.key]) === b.dataset.v)))
}
function render(what = 'all') {
  document.documentElement.dataset.theme = S.theme
  $('pincount').textContent = S.pins.length || ''
  $('issuecount').textContent = problemIcons().length || ''
  if (what !== 'ins') {
    ;({compare: renderCompare, rules: renderRules, dash: renderDash, motion: renderMotion, issues: renderIssues}[S.mode] || renderBrowse)()
    // Browse builds its own options row; the other views get one with just the shared options
    if (S.mode !== 'browse') $('main').insertAdjacentHTML('afterbegin', `<div class="fbar"><div class="filters opts">${S.mode === 'dash' ? MDIOPT : ''}${LOOK}</div></div>`)
  }
  renderInspector()
  sync()
  try { localStorage.setItem('ha-icons-sheet', JSON.stringify(S)) } catch {}
}

function select(n, scroll) {
  S.sel = n
  document.querySelectorAll('.cell,.dtile,.motions button').forEach(c => c.setAttribute('aria-current', c.dataset.n === n))
  if (scroll) document.querySelector(`.cell[data-n="${n}"]`)?.scrollIntoView({block: 'nearest'})
  render('ins')
}
function step(by) {
  const list = S.mode === 'compare' ? S.pins.map(n => byName[n]) : ordered()
  if (!list.length) return
  const at = list.findIndex(i => i.n === S.sel)
  select(list[(at + by + list.length) % list.length].n, true)
}
function togglePin(n) {
  S.pins = S.pins.includes(n) ? S.pins.filter(p => p !== n) : [...S.pins, n]
  render()
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-n]')
  if (!t) return
  const seg = t.closest('.seg[data-key]')
  if (seg) {
    S[seg.dataset.key] = t.dataset.v
    if (seg.dataset.key === 'variant') S.stageV = t.dataset.v
    return render(seg.dataset.key === 'tab' ? 'ins' : 'all')
  }
  if ('gotab' in t.dataset) { S.tab = 'review'; return render('ins') }
  if ('signin' in t.dataset) return signIn()
  if ('signout' in t.dataset) return signOut()
  if ('post' in t.dataset) return postComment(S.sel)
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render() }
  if (t.dataset.uses) { Object.assign(S, {uses: t.dataset.uses, mode: 'browse', filter: 'all', q: ''}); $('q').value = ''; return render() }
  if ('clearuses' in t.dataset) { S.uses = ''; return render() }
  if (t.dataset.rule) { Object.assign(S, {rule: t.dataset.rule, uses: '', mode: 'browse', filter: 'all', q: ''}); $('q').value = ''; return render() }
  if ('clearrule' in t.dataset) { S.rule = ''; return render() }
  if (t.dataset.cat) { Object.assign(S, {cat: t.dataset.cat, uses: '', rule: '', mode: 'browse', filter: 'all', q: ''}); $('q').value = ''; return render() }
  if ('animate' in t.dataset) { S.animate = !S.animate; return render() }
  if (t.dataset.unpin) return togglePin(t.dataset.unpin)
  if ('pause' in t.dataset) { t.setAttribute('aria-pressed', document.body.classList.toggle('paused')); return }
  if (t.dataset.step) return step(+t.dataset.step)
  if ('pin' in t.dataset) return togglePin(S.sel)
  if (t.dataset.stagev) { S.stageV = t.dataset.stagev; return render('ins') }
  if (t.dataset.n) (e.shiftKey || e.altKey) ? togglePin(t.dataset.n) : select(t.dataset.n, true)
})
document.addEventListener('change', e => {
  if (e.target.dataset.toggle) { S[e.target.dataset.toggle] = e.target.checked; render('ins') }
  if (e.target.id === 'cat') { S.cat = e.target.value; render() }
  if (e.target.id === 'ha') { S.ha = e.target.value; render() }
  if (e.target.id === 'st') { S.st = e.target.value; render() }
  if (e.target.id === 'setst') setStatus(S.sel, e.target.value)
})
$('q').value = S.q
$('q').addEventListener('input', e => { S.q = e.target.value; render() })
document.addEventListener('input', e => { if (e.target.id === 'draft') DRAFT[S.sel] = e.target.value })
document.addEventListener('keydown', e => {
  if (e.target.id === 'draft' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) return postComment(S.sel)
  if (e.target.matches('input[type=search],textarea,select')) { if (e.key === 'Escape') e.target.blur(); return }
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1) }
  else if (e.key.toLowerCase() === 'p') togglePin(S.sel)
  else if (e.key === '/') { e.preventDefault(); $('q').focus() }
})
render()
loadReviews()
loadMe()
// pick up status changes made on GitHub when the tab comes back into view
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadReviews() })
</script>
</html>
